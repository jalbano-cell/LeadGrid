<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadGrid — B2B Field Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1120; --panel:#0F1A2E; --panel-2:#14213A; --panel-3:#1B2C4B;
    --line:#22344F; --line-soft:#182740;
    --blue:#2F6BFF; --blue-2:#4D9FFF; --glow:rgba(47,107,255,.30);
    --text:#E7EEF8; --muted:#8DA0BC; --dim:#5C6E8A;
    --new:#7C8AA0; --contacted:#F5A524; --qualified:#4D9FFF; --proposal:#A855F7; --won:#22C55E; --lost:#EF4444;
    --sans:'Inter',system-ui,sans-serif; --disp:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  #app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;height:100vh}

  /* ---- Sidebar ---- */
  .sidebar{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
  .brand svg{flex:none}
  .brand b{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.02em}
  .brand span{color:var(--blue-2)}
  .navlabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:14px 10px 6px;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--muted);font-weight:500;transition:.14s;font-size:13.5px}
  .nav a svg{flex:none;opacity:.85}
  .nav a:hover{background:var(--panel-2);color:var(--text)}
  .nav a.active{background:linear-gradient(90deg,rgba(47,107,255,.20),rgba(47,107,255,.04));color:#fff}
  .nav a.active svg{opacity:1;color:var(--blue-2)}
  .nav a .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--panel-3);color:var(--muted);padding:1px 7px;border-radius:20px}
  .nav a.active .badge{background:var(--blue);color:#fff}
  .sidefoot{margin-top:auto;padding:10px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
  .sidefoot .av{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#7C4DFF);display:grid;place-items:center;font-weight:700;font-size:13px}
  .sidefoot small{display:block;color:var(--dim);font-size:11px}

  /* ---- Topbar ---- */
  .topbar{grid-column:2;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}
  .topbar h1{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.01em}
  .search{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
  .search input{background:none;border:none;color:var(--text);flex:1;outline:none;font-size:13px}
  .search input::placeholder{color:var(--dim)}
  .repswitch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 10px 6px 8px}
  .repswitch select{background:none;border:none;color:var(--text);outline:none;font-size:13px;font-weight:500}
  .topbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
  .topbtn:hover{color:var(--text);border-color:var(--blue)}

  /* ---- Main ---- */
  .main{grid-column:2;overflow:auto;position:relative}
  .view{display:none;padding:22px 26px;min-height:100%}
  .view.active{display:block}
  .view.nopad{padding:0;display:none}
  .view.nopad.active{display:block;height:100%}

  .viewhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
  .viewhead .t{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.02em}
  .viewhead .s{color:var(--muted);font-size:13px;margin-top:4px}
  .btn{background:var(--blue);color:#fff;padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.14s}
  .btn:hover{background:#1E5AEF;box-shadow:0 4px 18px var(--glow)}
  .btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--blue);box-shadow:none}
  .btn.danger{background:var(--lost);color:#fff}
  .btn.danger:hover{background:#DC2626;box-shadow:0 4px 18px rgba(239,68,68,.3)}
  .btn.danger-ghost{background:transparent;border:1px solid rgba(239,68,68,.35);color:#F87171}
  .btn.danger-ghost:hover{background:rgba(239,68,68,.1);border-color:var(--lost)}
  .rowdel{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--dim);border:1px solid transparent}
  .rowdel:hover{color:#F87171;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
  .confirm-wrap{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;padding:20px}
  .confirm-wrap.open{display:flex}
  .confirm-box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5);z-index:1}
  .confirm-icon{width:52px;height:52px;border-radius:14px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);display:grid;place-items:center;margin:0 auto 14px}
  .confirm-msg{font-size:14px;line-height:1.5;color:var(--text);margin-bottom:20px}
  .confirm-msg b{font-weight:600}
  .confirm-acts{display:flex;gap:10px}
  .confirm-acts .btn{flex:1;justify-content:center}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
  .kpi::after{content:'';position:absolute;inset:0 0 auto auto;width:90px;height:90px;background:radial-gradient(circle at top right,var(--glow),transparent 70%);pointer-events:none}
  .kpi .lab{color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.02em}
  .kpi .val{font-family:var(--disp);font-size:28px;font-weight:600;margin-top:8px;letter-spacing:-.02em}
  .kpi .val small{font-size:15px;color:var(--muted);font-weight:500}
  .kpi .delta{font-family:var(--mono);font-size:11.5px;margin-top:6px}
  .kpi .delta.up{color:var(--won)} .kpi .delta.down{color:var(--lost)}

  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card h3{font-family:var(--disp);font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .card h3 .link{font-family:var(--sans);font-size:12px;color:var(--blue-2);font-weight:500;cursor:pointer}

  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:9px}
  .fstage{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:12px;font-size:12.5px}
  .fstage .bar{height:26px;border-radius:7px;background:var(--panel-3);position:relative;overflow:hidden}
  .fstage .fill{height:100%;border-radius:7px;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .fstage .n{font-family:var(--mono);text-align:right;color:var(--muted)}
  .fstage .nm{color:var(--muted);font-weight:500}

  /* activity feed */
  .feed{display:flex;flex-direction:column;gap:2px}
  .fitem{display:flex;gap:11px;padding:9px 4px;font-size:12.5px;align-items:flex-start}
  .fitem .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
  .fitem .tx{flex:1}
  .fitem .tx b{font-weight:600}
  .fitem time{color:var(--dim);font-size:11px;font-family:var(--mono)}

  /* ---- Table (CRM/LeadFinder) ---- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .chip{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--panel);font-weight:500;transition:.14s}
  .chip:hover{border-color:var(--blue)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{padding:6px 14px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
  .seg button.on{background:var(--blue);color:#fff}

  .tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .tbl td{padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr{cursor:pointer;transition:.1s}
  .tbl tbody tr:hover{background:var(--panel-2)}
  .biz{display:flex;flex-direction:column}
  .biz b{font-weight:600}
  .biz small{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .pill .d{width:6px;height:6px;border-radius:50%}
  .cat{font-size:11.5px;color:var(--muted);background:var(--panel-3);padding:3px 8px;border-radius:6px}
  .nowww{font-size:10.5px;font-weight:600;color:var(--contacted);border:1px solid rgba(245,165,36,.4);padding:2px 6px;border-radius:5px;background:rgba(245,165,36,.08)}
  .val{font-family:var(--mono);font-weight:500}
  .repav{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff}

  /* pipeline kanban */
  .kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start}
  .kcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
  .kcol .khead{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:10px;padding:2px 4px}
  .kcol .khead .c{font-family:var(--mono);color:var(--muted);font-size:11px}
  .kcard{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .kcard:hover{border-color:var(--blue);transform:translateY(-1px)}
  .kcard b{font-size:12.5px;font-weight:600;display:block}
  .kcard small{color:var(--dim);font-size:11px}
  .kcard .kv{font-family:var(--mono);font-size:11px;color:var(--blue-2);margin-top:5px;display:block}

  /* ---- Map view ---- */
  .maplayout{display:grid;grid-template-columns:1fr 320px;height:100%}
  #map{height:100%;width:100%;min-height:340px;background:var(--ink)}
  .mappanel{border-left:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
  .mappanel .ph{padding:16px 18px;border-bottom:1px solid var(--line)}
  .mappanel .ph .t{font-family:var(--disp);font-size:16px;font-weight:600}
  .mappanel .ph .s{color:var(--muted);font-size:12px;margin-top:3px}
  .filterrow{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
  .mlist{flex:1}
  .mrow{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;align-items:center}
  .mrow:hover{background:var(--panel-2)}
  .mrow .mdot{width:10px;height:10px;border-radius:50%;flex:none}
  .mrow .mi{flex:1;min-width:0}
  .mrow .mi b{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .mi small{color:var(--dim);font-size:11px}
  .biz-marker{cursor:pointer}
  .pin{position:relative;display:grid;place-items:center;width:20px;height:20px}
  .pin .dot{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);position:relative;z-index:2}
  .pin .pulse{position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--pc);z-index:1;animation:pulsering 1.9s ease-out infinite}
  .pin .pdot{width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px dashed #3F5A7D;box-shadow:0 1px 5px rgba(0,0,0,.35)}
  @keyframes pulsering{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.7);opacity:0}100%{transform:scale(2.7);opacity:0}}
  .rpin{width:26px;height:26px;background:var(--blue);border:2.5px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;font-family:var(--mono);box-shadow:0 2px 7px rgba(0,0,0,.45)}
  .pop b{font-family:var(--disp);font-size:14px;font-weight:600}
  .pop .prow{display:flex;gap:6px;align-items:center;margin:8px 0;color:var(--muted);font-size:12px}
  .pop .pacts{display:flex;gap:6px;margin-top:10px}
  .pop .pacts button{flex:1;font-size:11.5px;padding:6px;border-radius:7px;background:var(--blue);color:#fff;font-weight:600}
  .pop .pacts button.g{background:var(--panel-3);border:1px solid var(--line)}

  /* map legend + source toggle */
  .maplegend{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);flex-wrap:wrap}
  .maplegend .lg{display:flex;align-items:center;gap:6px}
  .maplegend .lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .maplegend .lg i.ring{background:transparent;border:2px dashed #7C8AA0}
  .baseseg{margin-left:auto;display:flex;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px}
  .baseseg button{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;color:var(--muted)}
  .baseseg button.on{background:var(--blue);color:#fff}

  /* business overview detail */
  .bizdetail{display:none;flex-direction:column;flex:1;overflow:auto}
  .bizdetail.show{display:flex}
  .bd-back{display:flex;align-items:center;gap:7px;padding:12px 16px;color:var(--blue-2);font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .bd-back:hover{background:var(--panel-2)}
  .bd-hero{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
  .bd-hero .bd-cat{font-size:11px;color:var(--blue-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .bd-hero h2{font-family:var(--disp);font-size:19px;font-weight:600;margin:5px 0 8px;letter-spacing:-.02em;line-height:1.15}
  .bd-hero .bd-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .bd-hero .rate{font-family:var(--mono);font-size:12px;color:var(--contacted)}
  .bd-section{padding:15px 18px;border-bottom:1px solid var(--line-soft)}
  .bd-section .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:11px}
  .crow{display:flex;gap:11px;align-items:flex-start;padding:7px 0;font-size:13px}
  .crow .ci{width:30px;height:30px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;color:var(--blue-2);flex:none;border:1px solid var(--line)}
  .crow .cc{flex:1;min-width:0}
  .crow .cc .k{font-size:10.5px;color:var(--dim);margin-bottom:1px}
  .crow .cc .v{font-weight:500;word-break:break-word}
  .crow .cc a{color:var(--blue-2);text-decoration:none}
  .crow .cc a:hover{text-decoration:underline}
  .crow .cc .v.miss{color:var(--dim);font-style:italic;font-weight:400}
  .social-chips{display:flex;gap:8px;flex-wrap:wrap}
  .social-chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--text);text-decoration:none;transition:.14s}
  .social-chip:hover{border-color:var(--blue)}
  .social-chip.off{opacity:.45;font-style:italic}
  .social-chip svg{color:var(--blue-2)}
  .bd-cta{padding:16px 18px;margin-top:auto;background:var(--panel);border-top:1px solid var(--line)}
  .bd-cta .btn{width:100%;justify-content:center}
  .incrm{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--won);font-weight:600;font-size:13px;padding:11px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);border-radius:9px}
  .mappanel.detail .ph,.mappanel.detail .maplegend,.mappanel.detail .filterrow,.mappanel.detail .mlist{display:none}
  .mappanel.detail .bizdetail{display:flex}
  .srctag{float:right;font-size:9.5px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;text-transform:none}
  .srctag.places{background:rgba(77,159,255,.12);color:var(--blue-2)}
  .srctag.enriched{background:rgba(168,85,247,.14);color:#C084FC}
  .enrichnote{font-size:11px;color:var(--dim);margin-top:12px;display:flex;align-items:center;gap:6px;line-height:1.4}
  .enrichnote a{color:var(--blue-2);cursor:pointer;font-weight:500}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--line)}
  .tblwrap .tbl{border:none;border-radius:0;min-width:560px}
  .tblwrap .tbl.crm-tbl{min-width:1240px}
  .tbl td.mono{font-family:var(--mono);font-size:12px}
  .tbl td.dim{color:var(--muted)}
  .tbl td.nowrap{white-space:nowrap}
  .tbl .biz small{margin-top:3px}
  .sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .tlink{color:var(--blue-2);text-decoration:none;font-size:12.5px;white-space:nowrap}
  .tlink:hover{text-decoration:underline}
  .sics{display:flex;gap:8px;align-items:center}
  .sic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
  .sic:hover{border-color:var(--blue)}
  .scorepill{display:inline-flex;align-items:center;gap:8px}
  .scorepill .sbar{width:46px;height:6px;border-radius:5px;background:var(--panel-3);overflow:hidden;flex:none}
  .scorepill .sbar i{display:block;height:100%;border-radius:5px}
  .scorepill b{font-family:var(--mono);font-size:13px;font-weight:600;min-width:22px}

  /* ---- Drawer ---- */
  .drawer-wrap{position:fixed;inset:0;z-index:1000;display:none}
  .drawer-wrap.open{display:block}
  .scrim{position:absolute;inset:0;background:rgba(5,10,20,.55);backdrop-filter:blur(2px)}
  .drawer{position:absolute;top:0;right:0;height:100%;width:440px;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.4);overflow:auto;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1)}
  .drawer-wrap.open .drawer{transform:translateX(0)}
  .dhead{padding:20px 22px 16px;border-bottom:1px solid var(--line);position:relative}
  .dhead .x{position:absolute;top:16px;right:18px;color:var(--muted);width:30px;height:30px;border-radius:8px}
  .dhead .x:hover{background:var(--panel-2);color:var(--text)}
  .dhead .dcat{font-size:11.5px;color:var(--blue-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .dhead h2{font-family:var(--disp);font-size:21px;font-weight:600;margin:6px 0;letter-spacing:-.02em}
  .dhead .dmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .dbody{padding:18px 22px}
  .dsec{margin-bottom:22px}
  .dsec .st{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:11px}
  .kv2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kv2 .k{color:var(--muted);font-size:11.5px}
  .kv2 .v{font-weight:600;font-size:13.5px;margin-top:2px}
  .kv2 .v.mono{font-family:var(--mono);font-weight:500}
  .stageflow{display:flex;gap:4px;margin-bottom:8px}
  .stageflow button{flex:1;font-size:10.5px;padding:7px 4px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-weight:600}
  .stageflow button.on{color:#fff}
  .dacts{display:flex;gap:8px;margin-top:6px}
  .dacts .btn{flex:1;justify-content:center}
  .aihead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .aihead .st{margin-bottom:0}
  .aibadge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:20px;background:linear-gradient(135deg,var(--blue),#7C4DFF);color:#fff;vertical-align:middle;margin-left:6px}
  .ai-regen{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--blue-2);padding:5px 9px;border-radius:8px;border:1px solid var(--line)}
  .ai-regen:hover{border-color:var(--blue);background:var(--panel-2)}
  .aitext{font-size:13px;line-height:1.6;color:var(--text)}
  .themechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .tchip{font-size:11px;font-weight:500;padding:4px 9px;border-radius:7px}
  .tchip.pro{background:rgba(34,197,94,.1);color:#4ADE80;border:1px solid rgba(34,197,94,.25)}
  .tchip.con{background:rgba(245,165,36,.1);color:var(--contacted);border:1px solid rgba(245,165,36,.25)}
  .emailbox{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .emrow{display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line-soft);margin-bottom:9px}
  .emrow .emlbl{font-size:11px;color:var(--dim);width:22px}
  .emrow .emto{font-size:12.5px;color:var(--blue-2);font-weight:500}
  .emsubj{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-weight:600;font-family:var(--sans);margin-bottom:8px;outline:none}
  .emsubj:focus{border-color:var(--blue)}
  .embody{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--text);font-size:12.5px;line-height:1.6;font-family:var(--sans);resize:vertical;outline:none;min-height:180px}
  .embody:focus{border-color:var(--blue)}
  .emacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .emacts .btn{flex:1;justify-content:center;min-width:110px}
  .ai-skel{display:flex;flex-direction:column;gap:8px}
  .ai-skel span{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--panel-2) 25%,var(--panel-3) 50%,var(--panel-2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
  .ai-skel span:nth-child(2){width:92%}.ai-skel span:nth-child(3){width:78%}.ai-skel span:nth-child(4){width:85%}.ai-skel span:nth-child(5){width:60%}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .revlist{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px}
  .revlist-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between}
  .revlist-h span{text-transform:none;letter-spacing:0;font-family:var(--mono);color:var(--muted)}
  .revcard{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
  .revcard .revtop{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .revcard .revtop b{font-size:12.5px;font-weight:600}
  .revcard .revstars{color:var(--contacted);font-size:11px;letter-spacing:1px}
  .revcard .revtop time{margin-left:auto;font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .revcard p{font-size:12.5px;color:var(--muted);line-height:1.5}
  .timeline{display:flex;flex-direction:column;gap:0}
  .tl{display:flex;gap:12px;padding-bottom:16px;position:relative}
  .tl::before{content:'';position:absolute;left:5px;top:14px;bottom:-2px;width:1.5px;background:var(--line)}
  .tl:last-child::before{display:none}
  .tl .tdot{width:11px;height:11px;border-radius:50%;border:2px solid var(--panel);flex:none;margin-top:2px;z-index:1}
  .tl .tc b{font-size:12.5px;font-weight:600}
  .tl .tc p{color:var(--muted);font-size:12px;margin-top:1px}
  .tl .tc time{color:var(--dim);font-size:11px;font-family:var(--mono)}

  /* ---- Calendar ---- */
  .calwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .calgrid{display:grid;grid-template-columns:56px repeat(5,1fr)}
  .calgrid .ch{padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line-soft);font-size:12px;font-weight:600}
  .calgrid .ch small{display:block;color:var(--dim);font-weight:500;font-size:11px;margin-top:2px}
  .calgrid .ch.corner{background:var(--panel-2)}
  .calgrid .hr{padding:8px 6px;text-align:right;font-size:11px;color:var(--dim);font-family:var(--mono);border-right:1px solid var(--line);border-bottom:1px solid var(--line-soft)}
  .calgrid .cell{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);min-height:52px;padding:3px;position:relative}
  .ev{border-radius:7px;padding:6px 8px;font-size:11px;font-weight:600;color:#fff;margin-bottom:3px;cursor:pointer;line-height:1.25}
  .ev small{display:block;font-weight:500;opacity:.85;font-size:10px}

  /* ---- Routes ---- */
  .routelayout{display:grid;grid-template-columns:360px 1fr;gap:16px;height:calc(100vh - 150px)}
  .routepanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;display:flex;flex-direction:column}
  .routestats{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}
  .routestats .rs{padding:14px;text-align:center;border-right:1px solid var(--line-soft)}
  .routestats .rs:last-child{border-right:none}
  .routestats .rs .v{font-family:var(--disp);font-size:20px;font-weight:600}
  .routestats .rs .l{color:var(--muted);font-size:11px;margin-top:2px}
  .stops{padding:8px}
  .stop{display:flex;gap:12px;padding:11px 12px;border-radius:10px;align-items:center;position:relative}
  .stop:hover{background:var(--panel-2)}
  .stop .num{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;z-index:1}
  .stop .si{flex:1}
  .stop .si b{font-size:13px;font-weight:600;display:block}
  .stop .si small{color:var(--dim);font-size:11px}
  .stop .st{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
  .stopline{position:absolute;left:23px;top:0;bottom:0;width:1.5px;background:var(--line)}
  #routemap{height:100%;border-radius:14px;border:1px solid var(--line)}

  /* ---- Reps ---- */
  .repgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .repcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .repcard .rh{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  .repcard .rav{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff}
  .repcard .rn b{font-family:var(--disp);font-size:16px;font-weight:600;display:block}
  .repcard .rn small{color:var(--muted);font-size:12px}
  .repstats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .repstats .rst{background:var(--panel-2);border-radius:9px;padding:10px 12px}
  .repstats .rst .v{font-family:var(--disp);font-size:19px;font-weight:600}
  .repstats .rst .l{color:var(--muted);font-size:11px;margin-top:1px}
  .repbar{height:7px;border-radius:5px;background:var(--panel-3);overflow:hidden;margin-top:4px}
  .repbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-2))}

  /* ---- AI Assistant ---- */
  .ai-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--blue),#7C4DFF);display:grid;place-items:center;box-shadow:0 8px 30px var(--glow);z-index:900;transition:.2s}
  .ai-fab:hover{transform:scale(1.06)}
  .ai-panel{position:fixed;bottom:24px;right:24px;width:400px;height:560px;max-height:calc(100vh - 48px);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55);z-index:901;display:none;flex-direction:column;overflow:hidden}
  .ai-panel.open{display:flex}
  .ai-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .ai-head .aicon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#7C4DFF);display:grid;place-items:center}
  .ai-head b{font-family:var(--disp);font-size:14px;font-weight:600;display:block}
  .ai-head small{color:var(--won);font-size:11px;display:flex;align-items:center;gap:5px}
  .ai-head small::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--won)}
  .ai-head .x{margin-left:auto;color:var(--muted);width:30px;height:30px;border-radius:8px}
  .ai-head .x:hover{background:var(--panel-2)}
  .ai-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:11px 13px;border-radius:13px;font-size:13px;line-height:1.5}
  .msg.bot{background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
  .msg.me{background:var(--blue);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .msg b{font-weight:600}
  .msg .mrow2{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line-soft)}
  .msg .mrow2:last-child{border:none}
  .msg .mrow2 span:last-child{font-family:var(--mono);color:var(--blue-2)}
  .ai-sugg{padding:0 16px 10px;display:flex;gap:7px;flex-wrap:wrap}
  .ai-sugg button{font-size:11.5px;padding:7px 11px;border-radius:18px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
  .ai-sugg button:hover{border-color:var(--blue);color:var(--text)}
  .ai-input{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
  .ai-input input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--text);outline:none;font-size:13px}
  .ai-input input:focus{border-color:var(--blue)}
  .ai-input button{width:40px;height:40px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}

  .empty{text-align:center;color:var(--dim);padding:50px 20px}
  .empty svg{opacity:.4;margin-bottom:12px}
  .flbl{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .area-suggest-wrap{position:relative}
  .area-suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-height:220px;overflow:auto;z-index:50;display:none}
  .area-suggest.open{display:block}
  .area-suggest button{display:block;width:100%;text-align:left;padding:9px 12px;font-size:13px;color:var(--text);background:none;border:none;cursor:pointer}
  .area-suggest button:hover,.area-suggest button.hi{background:var(--panel-3)}
  .keyrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .keynote{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;flex:1;min-width:200px;line-height:1.4}

  /* ---- Tablet ---- */
  @media(max-width:1100px){
    #app{grid-template-columns:200px 1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
    .kanban{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
    .kcol{min-width:170px;flex:none}
    .repgrid{grid-template-columns:repeat(2,1fr)}
    .routelayout{grid-template-columns:1fr;height:auto}
    #routemap{height:320px}
  }

  /* ---- Phone ---- */
  @media(max-width:760px){
    body{font-size:14px}
    #app{grid-template-columns:1fr;grid-template-rows:52px 1fr 60px}
    /* sidebar -> bottom tab bar */
    .sidebar{grid-row:3;grid-column:1;flex-direction:row;width:100%;height:60px;padding:0;border-right:none;border-top:1px solid var(--line);align-items:stretch;z-index:600}
    .brand,.navlabel,.sidefoot{display:none}
    .sidebar .nav:last-of-type{display:none} /* hide AI nav row (fab covers it) */
    #nav{flex-direction:row;flex:1;gap:0;justify-content:space-around;align-items:stretch}
    #nav a{flex-direction:column;gap:2px;justify-content:center;padding:6px 2px;border-radius:0;font-size:9.5px;font-weight:500;flex:1;min-width:0}
    #nav a span:not(.badge){font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    #nav a .badge{display:none}
    #nav a svg{width:20px;height:20px}
    #nav a.active{background:none;color:var(--blue-2)}
    #nav a.active svg{opacity:1}
    /* topbar */
    .topbar{grid-column:1;grid-row:1;padding:0 14px;gap:10px}
    .topbar h1{font-size:15px}
    .search{display:none}
    .repswitch{margin-left:auto;padding:6px 8px}
    .repswitch select{max-width:96px}
    /* main */
    .main{grid-column:1;grid-row:2}
    .view{padding:16px 14px}
    .viewhead{margin-bottom:16px}
    .viewhead .t{font-size:20px}
    .kpis{gap:10px}
    .kpi{padding:13px 14px}
    .kpi .val{font-size:22px}
    /* map: stack, map on top + panel below (in-flow, bounded by grid row) */
    .maplayout{grid-template-columns:1fr;display:flex;flex-direction:column;height:100%}
    #map{flex:1 1 46%;min-height:220px}
    .mappanel{flex:1 1 54%;border-left:none;border-top:1px solid var(--line);min-height:0}
    .maplayout.detailmode #map{flex:0 0 34vh;min-height:0}
    .maplayout.detailmode .mappanel{flex:1 1 auto}
    .mlist{-webkit-overflow-scrolling:touch}
    /* drawer + AI as full-width sheets */
    .drawer{width:100%}
    .ai-panel{left:0;right:0;bottom:0;width:auto;height:82vh;max-height:82vh;border-radius:20px 20px 0 0}
    .ai-fab{bottom:74px;right:16px;width:52px;height:52px}
    /* calendar scrolls */
    .calwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .calgrid{min-width:600px}
    .repgrid{grid-template-columns:1fr}
    .kanban{grid-template-columns:none}
    /* stop iOS zoom on focus */
    .ai-input input,.repswitch select,#fcat,#farea{font-size:16px}
    /* bottom sheet grab handle */
    .ai-head{padding-top:18px}
  }
  @media(max-width:400px){
    #nav a span:not(.badge){display:none} /* icon-only tabs on very small screens */
    #nav a svg{width:22px;height:22px}
  }
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="11" stroke="#2F6BFF" stroke-width="1.6"/><circle cx="13" cy="4" r="2.4" fill="#4D9FFF"/><circle cx="21" cy="17" r="2.4" fill="#4D9FFF"/><circle cx="5" cy="17" r="2.4" fill="#4D9FFF"/><circle cx="13" cy="13" r="3" fill="#2F6BFF"/><path d="M13 6.4v3.6M18.8 15.6 15.4 13.8M7.2 15.6l3.4-1.8" stroke="#2F6BFF" stroke-width="1.3"/></svg>
      <b>Lead<span>Grid</span></b>
    </div>
    <div class="navlabel">Workspace</div>
    <nav class="nav" id="nav">
      <a data-view="areas" class="active"><i data-ic="map"></i><span>Map</span></a>
      <a data-view="dashboard"><i data-ic="grid"></i><span>Dashboard</span></a>
      <a data-view="crm"><i data-ic="users"></i><span>CRM</span><span class="badge" id="nb-crm">0</span></a>
      <a data-view="finder"><i data-ic="search"></i><span>Finder</span></a>
      <a data-view="calendar"><i data-ic="cal"></i><span>Calendar</span></a>
      <a data-view="routes"><i data-ic="route"></i><span>Routes</span></a>
      <a data-view="reps"><i data-ic="badge"></i><span>Reps</span></a>
    </nav>
    <div class="navlabel">Intelligence</div>
    <nav class="nav">
      <a onclick="openAI()"><i data-ic="spark"></i><span>AI Assistant</span></a>
    </nav>
    <div class="sidefoot">
      <div class="av">JA</div>
      <div><b style="font-size:13px">John Albano</b><small>OmniGrid Digital</small></div>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header class="topbar">
    <h1 id="crumb">Dashboard</h1>
    <div class="search"><i data-ic="search"></i><input id="globalsearch" placeholder="Search businesses, contacts, areas…"></div>
    <div class="repswitch"><i data-ic="badge"></i><select id="repfilter"><option value="all">All reps</option></select></div>
    <button class="topbtn" onclick="openAI()"><i data-ic="spark"></i></button>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <section class="view" data-view="dashboard" id="v-dashboard"></section>
    <section class="view" data-view="crm" id="v-crm"></section>
    <section class="view nopad active" data-view="areas" id="v-areas"></section>
    <section class="view" data-view="finder" id="v-finder"></section>
    <section class="view" data-view="calendar" id="v-calendar"></section>
    <section class="view" data-view="routes" id="v-routes"></section>
    <section class="view" data-view="reps" id="v-reps"></section>
  </main>
</div>

<!-- DRAWER -->
<div class="drawer-wrap" id="drawer"><div class="scrim" onclick="closeDrawer()"></div><div class="drawer" id="drawerbody"></div></div>

<!-- CONFIRM -->
<div class="confirm-wrap" id="confirmModal"><div class="scrim" onclick="closeConfirm()"></div>
  <div class="confirm-box">
    <div class="confirm-icon"><i data-ic="trash" data-c="#EF4444" data-s="22"></i></div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-acts"><button class="btn ghost" onclick="closeConfirm()">Cancel</button><button class="btn danger" onclick="doConfirm()" id="confirmYes">Delete</button></div>
  </div>
</div>

<!-- REP EDITOR -->
<div class="confirm-wrap" id="repModal"><div class="scrim" onclick="closeRepModal()"></div>
  <div class="confirm-box" style="text-align:left;max-width:360px">
    <div style="font-weight:600;font-size:16px;margin-bottom:16px" id="repModalTitle">Add rep</div>
    <div class="flbl">Name</div>
    <input id="repName" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px">
    <div class="flbl">Initials</div>
    <input id="repInit" maxlength="3" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px">
    <div class="flbl">Territory</div>
    <input id="repArea" placeholder="e.g. Mississauga · Oakville" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px">
    <div class="flbl">Color</div>
    <input id="repColor" type="color" value="#2F6BFF" style="width:100%;height:38px;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:2px;margin-bottom:14px">
    <div id="repModalError" style="color:#F87171;font-size:12px;margin-bottom:10px;display:none"></div>
    <div class="confirm-acts">
      <button class="btn ghost" style="flex:1;justify-content:center" onclick="closeRepModal()">Cancel</button>
      <button class="btn" style="flex:1;justify-content:center" onclick="saveRepModal()">Save</button>
    </div>
    <button class="btn ghost" id="repDeleteBtn" style="width:100%;justify-content:center;margin-top:10px;color:#F87171;display:none" onclick="deleteRepFromModal()">Delete rep</button>
  </div>
</div>

<!-- AI -->
<button class="ai-fab" id="aifab" onclick="openAI()"><i data-ic="spark" data-c="#fff" data-s="22"></i></button>
<div class="ai-panel" id="aipanel">
  <div class="ai-head">
    <div class="aicon"><i data-ic="spark" data-c="#fff" data-s="18"></i></div>
    <div><b>Grid Assistant</b><small>Reading your pipeline</small></div>
    <button class="x" onclick="closeAI()"><i data-ic="x"></i></button>
  </div>
  <div class="ai-body" id="aibody"></div>
  <div class="ai-sugg" id="aisugg"></div>

function ratingWord(r){return r>=4.6?'highly-rated':r>=4.2?'well-reviewed':r>=3.8?'solidly-rated':'up-and-coming';}
function priorityWord(s){return s>=75?'top-priority':s>=58?'a strong':s>=45?'a moderate':'a lower-priority';}
function genWhy(l,seed){
  const cat=l.cat.toLowerCase();
  const open=seed%2
    ? `${l.name} is ${ratingWord(l.rating)==='up-and-coming'?'an':'a'} ${ratingWord(l.rating)} ${cat} in ${l.city} — ${l.rating}★ across ${l.reviewCount} Google reviews.`
    : `With ${l.reviewCount} reviews at ${l.rating}★, ${l.name} is one of the more established ${cat}s in ${l.city}.`;
  const gap=l.website
    ? `They already have a website, but there are quick wins in turning Google traffic into booked customers — follow-up automation and review generation especially.`
    : `Critically, they have no website. Customers finding them on Google have no way to book or learn more, so they're leaking business to competitors who show up polished — exactly the gap you close.`;
  const fit=`At a sales score of ${l.score}, this is ${priorityWord(l.score)} target${l.hot?', and it’s already flagged hot':''}.`;
  const now=l.stage==='new'?'No one has reached out yet, so you’d be first in the door.':`They’re currently at the ${stageOf(l.stage).name.toLowerCase()} stage — keep the momentum going.`;
  return `${open} ${gap} ${fit} ${now}`;
}
function genReview(l){
  const revs=l.reviews||[];
  const t=REVIEW_THEMES[l.cat]||{pros:['friendly service','good value'],cons:['room to improve online presence']};
  const pros=t.pros.slice(0,3), cons=t.cons.slice(0,2);
  const pos=revs.filter(r=>r.rating>=4).length, neg=revs.length-pos;
  const lead=l.rating>=4.4?'Customers consistently praise':l.rating>=4.0?'Reviewers generally appreciate':'Feedback is mixed, but many note';

  text+=l.website?'':'Several reviewers ask whether they have a website or online booking — clear, stated demand you can capture.';
  return {text:text.trim(),pros,cons,samples:revs};
}

let gmapsReady=false, gmapsLoading=false, gmapsQueue=[], googleAuthError=null;
function ensureGoogleMaps(cb){
  if(gmapsReady){cb();return;}
  gmapsQueue.push(cb);
  if(gmapsLoading)return;
  gmapsLoading=true;
  window.onGoogleMapsReady=()=>{
    gmapsReady=true; gmapsLoading=false; googleAuthError=null;
    const q=gmapsQueue; gmapsQueue=[]; q.forEach(fn=>fn());
  };
  window.gm_authFailure=()=>{
    gmapsReady=false; gmapsLoading=false; gmapsQueue=[];
    googleAuthError='Google rejected this API key (invalid, unbilled, or missing the Maps JavaScript API / Places API). Check your key in Cloud Console and try again.';
    if(state.view==='routes')renderRoutes(); else if(state.view==='areas')renderAreas();
  };
  const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_KEY)+'&libraries=marker&loading=async&callback=onGoogleMapsReady';
  s.onerror=()=>{
    gmapsLoading=false; gmapsQueue=[];
    googleAuthError='Could not load the Google Maps script — check your internet connection.';
    if(state.view==='routes')renderRoutes(); else if(state.view==='areas')renderAreas();
  };
  document.head.appendChild(s);
}
function nudgeMap(m){

    <input id="${containerId}-ggkey" type="password" placeholder="Google API key" value="${GOOGLE_KEY?GOOGLE_KEY.replace(/"/g,'&quot;'):''}" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-family:var(--mono);font-size:12px;margin-bottom:8px">

  </div>`;

async function searchMapArea(){
  if(!map)return;
  if(!GOOGLE_KEY){$('#mapsearchstatus').textContent='No Google API key configured — see Connect Google Maps.';return;}
  const query=$('#mapSearchCat').value.trim();
  const radiusKm=+$('#mapSearchRadius').value;
  if(!query){$('#mapsearchstatus').textContent='Type what kind of business to search for.';return;}
  if(!radiusKm||radiusKm<=0){$('#mapsearchstatus').textContent='Enter a radius greater than 0.';return;}
  const radius=Math.min(radiusKm,50)*1000; // Places caps location-biased search well under 50km anyway
  const c=map.getCenter(), lat=c.lat(), lng=c.lng();
  const btn=$('#mapsearchbtn'), status=$('#mapsearchstatus');
  btn.disabled=true; btn.style.opacity=.6;
  status.textContent=`Searching "${query}" within ${radiusKm} km of where you're looking…`;
  try{
    const places=await searchPlaces(query,{lat,lng,radius});
    const seen=new Set(livePool.map(p=>p.id));
    let added=0;
    places.forEach(p=>{
      if(!p.id)return;
      const gid='g_'+p.id;
      if(seen.has(gid)||addedProspects.has(gid))return;
      const biz=placeToBusiness(p,query); // if Google's own type data is ambiguous, fall back to what was typed
      if(!biz.lat||!biz.lng)return;
      seen.add(gid);
      livePool.push(biz);
      added++;
    });
    drawSearchRadius(lat,lng,radius);
    mapSource='all';
    mapFilter=CATS.includes(query)?query:'all'; // only the fixed chip row can highlight an exact match
    drawMarkers();
    status.textContent=`${added} new result${added===1?'':'s'} found within ${radiusKm} km`+(added?'':' (or already on your map)');
  }catch(err){
    status.textContent='Search failed — '+err.message;
  }finally{
    btn.disabled=false; btn.style.opacity=1;
  }
}

/* ---- Google Places API (New) — searchText. Works from the browser (CORS-enabled). ---- */
// Routed through our own /api/places-search rather than calling Google directly — keeps the
// Places-capable key server-side only, unlike the Maps JavaScript API key (unavoidably client-side
// since it loads as a <script> tag, protected only by its HTTP referrer restriction instead).
async function searchPlaces(textQuery,near){
  const res=await fetch('/api/places-search',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({textQuery,near})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||(res.status+' '+res.statusText));
  return data.places||[];
}
function comp(p,type){const c=(p.addressComponents||[]).find(x=>(x.types||[]).includes(type));return c?(c.shortText||c.longText||''):'';}
function placeToBusiness(p,queryCat){
  const loc=p.location||{};
  const num=comp(p,'street_number'), route=comp(p,'route');
  const street=((num?num+' ':'')+route)||((p.formattedAddress||'').split(',')[0]);
  const inferred=inferCategory(p.types);
  const b={
    id:'g_'+(p.id||Math.random().toString(36).slice(2)),
    name:(p.displayName&&p.displayName.text)||'Unknown business',
    // Google's own place types don't reliably distinguish some trades (e.g. HVAC/landscaping
    // both surface as generic "general_contractor"), so fall back to whichever category query
    // actually found this result when Google's type data is inconclusive.
    cat:inferred==='Other'&&queryCat?queryCat:inferred,
    city:comp(p,'locality')||comp(p,'sublocality')||comp(p,'administrative_area_level_2')||'',
    province:comp(p,'administrative_area_level_1')||'ON',
    postal:comp(p,'postal_code')||'',
    street, address:p.formattedAddress||'',
    lat:loc.latitude, lng:loc.longitude,
    phone:p.nationalPhoneNumber||'',
    website:!!p.websiteUri, web:p.websiteUri||null,
    rating:p.rating||0, reviewCount:p.userRatingCount||0,
    value:1400+((p.userRatingCount||0)>150?400:200),
    email:null,                                   // Places doesn't return email — enrich later
    socials:{instagram:null,facebook:null,google:p.googleMapsUri?'Google Business Profile':null},
    reviews:[],                                   // fetch via Place Details later
    hot:false
  };
  b.score=scoreFor(b);
  return b;
}

async function runFinder(){
  const area=$('#farea').value.trim(), noweb=$('#fnoweb').checked;
  const out=$('#finderresults'), btn=$('#findbtn');
  if(!GOOGLE_KEY){
    out.innerHTML='<div class="empty">'+ic('search','#5C6E8A',34)+'<div>No Google API key configured — set VITE_GOOGLE_API_KEY in .env.local, or add one via Connect Google Maps on the Map tab.</div></div>';
    return;
  }
  if(!area){
    out.innerHTML='<div class="empty">'+ic('search','#5C6E8A',34)+'<div>Enter an area to search.</div></div>';
    return;
  }
  btn.disabled=true; btn.style.opacity=.6;
  out.innerHTML='<div class="empty">'+ic('search','#5C6E8A',34)+`<div>Searching ${CATS.length} categories in ${area}…</div></div>`;
  try{
    // No user-picked type: query every category in parallel, then label each hit from its own
    // Google Places type (inferCategory), falling back to whichever query found it if that's inconclusive.
    const batches=await Promise.allSettled(CATS.map(c=>searchPlaces(`${CAT_QUERY_TERMS[c]} in ${area}`).then(places=>({cat:c,places}))));
    const failed=batches.filter(b=>b.status==='rejected');
    if(failed.length===batches.length)throw failed[0].reason||new Error('Places API request failed');
    const seen=new Set();
    let res=[];
    batches.forEach(b=>{
      if(b.status!=='fulfilled')return;
      const {cat,places}=b.value;
      places.forEach(p=>{
        if(!p.id||seen.has(p.id)||addedProspects.has('g_'+p.id))return; // skip dupes + businesses already in the CRM
        seen.add(p.id);
        const biz=placeToBusiness(p,cat);
        if(biz.lat&&biz.lng)res.push(biz);
      });
    });
    if(noweb)res=res.filter(b=>!b.website);
    livePool=res;                          // feed the map
    state.finderResults=res;
    state.finderArea=area;
    state.finderCat='';
    renderFinderResults(res,area);
    if(state.view==='areas'&&map)drawMarkers();
  }catch(err){
    out.innerHTML=`<div class="card" style="border-color:rgba(239,68,68,.4)"><b style="color:#F87171">Places API error</b><div style="color:var(--muted);font-size:13px;margin-top:6px">${(''+err.message).replace(/</g,'&lt;')}</div><div style="color:var(--dim);font-size:12px;margin-top:8px">Check the key is valid, billing is enabled, and the <b>Places API (New)</b> is turned on. If you opened this file locally, the request still works — but some corporate networks block it.</div></div>`;
  }finally{btn.disabled=false; btn.style.opacity=1;}
}

let routemap;
function renderRoutes(){
  const rep=state.rep==='all'?'r1':state.rep;
  const stops=optimizeRoute(LEADS.filter(l=>l.rep===rep&&!['won','lost'].includes(l.stage)));
  let dist=0,legs=[];
  for(let i=1;i<stops.length;i++){const d=haversine(stops[i-1],stops[i]);dist+=d;legs.push(d);}
  const drive=Math.round(dist/40*60+stops.length*15);
  $('#v-routes').innerHTML=`<div class="viewhead"><div><div class="t">Routes</div><div class="s">Optimized field route for ${repById(rep).name}</div></div>
    <div class="seg">${REPS.map(r=>`<button class="${rep===r.id?'on':''}" onclick="state.rep='${r.id}';renderRoutes()">${r.init}</button>`).join('')}</div></div>
    <div class="routelayout">
      <div class="routepanel">
        <div class="routestats">
          <div class="rs"><div class="v">${stops.length}</div><div class="l">stops</div></div>
          <div class="rs"><div class="v">${dist.toFixed(1)}<small style="font-size:12px"> km</small></div><div class="l">drive</div></div>
          <div class="rs"><div class="v">${Math.floor(drive/60)}h ${drive%60}m</div><div class="l">est. day</div></div>
        </div>
        <div class="stops">${stops.length?'<div style="position:relative"><div class="stopline"></div>'+stops.map((l,i)=>`<div class="stop" onclick="if(routemap){routemap.panTo({lat:${l.lat},lng:${l.lng}});routemap.setZoom(14);}openLead('${l.id}')"><span class="num">${i+1}</span><div class="si"><b>${l.name}</b><small>${l.city} · ${l.cat}${l.website?'':' · no website'}</small></div><div class="st">${i===0?'start':legs[i-1].toFixed(1)+' km'}</div></div>`).join('')+'</div>':'<div class="empty">No open leads for this rep.</div>'}</div>
      </div>
      <div id="routemap"></div>
    </div>`;
  setTimeout(()=>initRouteMap(stops),60);
}
function optimizeRoute(leads){
  if(leads.length<2)return leads;
  const start={lat:43.5890,lng:-79.6441}; // agency base (Mississauga)
  let remaining=[...leads],route=[],cur=start;
  while(remaining.length){
    remaining.sort((a,b)=>haversine(cur,a)-haversine(cur,b));
    const next=remaining.shift();route.push(next);cur=next;
  }
  return route;
}
function initRouteMap(stops){
  routemap=null;
  const el=$('#routemap'); if(!el)return;
  if(!stops.length)return;
  if(!GOOGLE_KEY){el.innerHTML=googleGateHTML('routemap');return;}
  if(googleAuthError){el.innerHTML=googleGateHTML('routemap');return;}
  if(!gmapsReady){ensureGoogleMaps(()=>initRouteMap(stops));return;}
  routemap=new google.maps.Map(el,{
    center:{lat:stops[0].lat,lng:stops[0].lng}, zoom:10,
    mapId:GOOGLE_MAP_ID||'DEMO_MAP_ID',
    renderingType:google.maps.RenderingType.VECTOR,
    colorScheme:mapColorScheme==='dark'?google.maps.ColorScheme.DARK:google.maps.ColorScheme.LIGHT,
    disableDefaultUI:true, clickableIcons:false
  });
  new google.maps.Polyline({
    path:stops.map(l=>({lat:l.lat,lng:l.lng})), map:routemap, strokeOpacity:0,
    icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,strokeColor:'#2F6BFF',scale:3},offset:'0',repeat:'12px'}]
  });
  const bounds=new google.maps.LatLngBounds();
  stops.forEach((l,i)=>{
    bounds.extend({lat:l.lat,lng:l.lng});
    const pinEl=document.createElement('div');
    pinEl.innerHTML=`<div class="rpin">${i+1}</div>`;
    const marker=new google.maps.marker.AdvancedMarkerElement({map:routemap,position:{lat:l.lat,lng:l.lng},content:pinEl});
    const info=new google.maps.InfoWindow({content:'<b style="font-family:var(--disp)">'+l.name+'</b>'});
    marker.addListener('gmp-click',()=>info.open({anchor:marker,map:routemap}));
  });
  routemap.fitBounds(bounds,44);
}

  const area=$('#repArea').value.trim(), color=$('#repColor').value;
  const err=$('#repModalError');
  if(!name){err.textContent='Name is required.';err.style.display='block';return;}
  if(_editingRepId){
    const r=repById(_editingRepId);
    Object.assign(r,{name,init,area,color});
  }else{
    REPS.push({id:'r_'+Date.now(),name,init,area,color});
  }
  closeRepModal();
  renderRepFilter();
  render(state.view);
}
function deleteRepFromModal(){
  if(!_editingRepId)return;
  const r=repById(_editingRepId);
  const assigned=LEADS.filter(l=>l.rep===_editingRepId).length;
  if(assigned>0){
    $('#repModalError').textContent=`Reassign or remove ${r.name}'s ${assigned} lead${assigned===1?'':'s'} before deleting them.`;
    $('#repModalError').style.display='block';
    return;
  }
  REPS=REPS.filter(x=>x.id!==_editingRepId);
  if(state.rep===_editingRepId)state.rep='all';
  closeRepModal();
  renderRepFilter();
  render(state.view);
}

/* ========== AI ASSISTANT ========== */
const AI_SUGG=['Top leads to call today','Which rep is underloaded?','Summarize Mississauga','No-website opportunities'];
function openAI(){$('#aipanel').classList.add('open');$('#aifab').style.display='none';if(!$('#aibody').dataset.init){aiBot("Hey John — I can see your live pipeline. Ask me who to call, where the gaps are, or to summarize an area.");renderSugg();$('#aibody').dataset.init=1;}}
function closeAI(){$('#aipanel').classList.remove('open');$('#aifab').style.display='grid';}
function renderSugg(){$('#aisugg').innerHTML=AI_SUGG.map(s=>`<button onclick="aiSend('${s}')">${s}</button>`).join('');}
function aiBot(html){const d=document.createElement('div');d.className='msg bot';d.innerHTML=html;$('#aibody').appendChild(d);$('#aibody').scrollTop=1e6;}
function aiMe(t){const d=document.createElement('div');d.className='msg me';d.textContent=t;$('#aibody').appendChild(d);$('#aibody').scrollTop=1e6;}
function aiSend(preset){
  const q=preset||$('#aiinput').value.trim();if(!q)return;
  aiMe(q);$('#aiinput').value='';
  setTimeout(()=>aiBot(aiAnswer(q.toLowerCase())),320);
}
function aiAnswer(q){
  const ls=visibleLeads();
  if(q.includes('call')||q.includes('today')||q.includes('priorit')){
    const hot=[...ls].filter(l=>!['won','lost'].includes(l.stage)).sort((a,b)=>(b.hot?1:0)-(a.hot?1:0)||b.value-a.value).slice(0,4);
    return `<b>Top 4 to call today</b> — ranked by intent + value:${hot.map((l,i)=>`<div class="mrow2"><span>${i+1}. ${l.name}${l.hot?' 🔥':''}</span><span>${money(l.value)}</span></div>`).join('')}<div style="margin-top:8px;color:var(--muted)">The two 🔥 are late-stage — I'd hit those first.</div>`;
  }
  if(q.includes('rep')||q.includes('underload')||q.includes('load')||q.includes('gap')){
    const load=REPS.map(r=>({r,n:LEADS.filter(l=>l.rep===r.id&&!['won','lost'].includes(l.stage)).length})).sort((a,b)=>a.n-b.n);
    return `<b>Rep capacity</b> — lightest load first:${load.map(x=>`<div class="mrow2"><span>${x.r.name}</span><span>${x.n} open</span></div>`).join('')}<div style="margin-top:8px;color:var(--muted)">${load[0].r.name.split(' ')[0]} has room — route the next batch there.</div>`;
  }
  if(q.includes('mississauga')||q.includes('summar')||q.includes('area')){
    const area=ls.filter(l=>['Mississauga','Oakville'].includes(l.city));
    const val=area.reduce((s,l)=>s+l.value,0);const noweb=area.filter(l=>!l.website).length;
    return `<b>Mississauga + Oakville</b><div class="mrow2"><span>Leads</span><span>${area.length}</span></div><div class="mrow2"><span>Pipeline</span><span>${money(val)}</span></div><div class="mrow2"><span>No-website</span><span>${noweb}</span></div><div class="mrow2"><span>Owner</span><span>Zain Khan</span></div><div style="margin-top:8px;color:var(--muted)">9 Natural Nails is at proposal — closest to closing.</div>`;
  }
  if(q.includes('website')||q.includes('no-website')||q.includes('opportun')){
    const nw=ls.filter(l=>!l.website&&!['won','lost'].includes(l.stage)).sort((a,b)=>b.value-a.value).slice(0,5);
    return `<b>No-website leads</b> — your warmest pitch (you can lead with a mockup):${nw.map(l=>`<div class="mrow2"><span>${l.name}</span><span>${money(l.value)}</span></div>`).join('')}`;
  }
  if(q.includes('total')||q.includes('pipeline')||q.includes('value')){
    const open=ls.filter(l=>!['won','lost'].includes(l.stage));const v=open.reduce((s,l)=>s+l.value,0);
    return `Open pipeline right now is <b>${money(v)}</b> across ${open.length} leads. Won this month adds ${money(ls.filter(l=>l.stage==='won').reduce((s,l)=>s+l.value,0))}.`;
  }
  return `I can help with: who to <b>call today</b>, <b>rep capacity</b>, an <b>area summary</b>, or <b>no-website</b> opportunities. Try one of the chips below.`;
}

/* ========== INIT ========== */
document.querySelectorAll('#nav a[data-view]').forEach(a=>a.addEventListener('click',()=>go(a.dataset.view)));
function renderRepFilter(){
  const sel=$('#repfilter'), keep=sel.value;
  sel.innerHTML='<option value="all">All reps</option>'+REPS.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
  sel.value=REPS.some(r=>r.id===keep)?keep:'all';
  if(sel.value!==keep){state.rep=sel.value;}
}
renderRepFilter();
$('#repfilter').addEventListener('change',e=>{state.rep=e.target.value;render(state.view);});
$('#globalsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.toLowerCase();const hit=LEADS.find(l=>l.name.toLowerCase().includes(q));if(hit)openLead(hit.id);}});
const style=document.createElement('style');style.textContent='@keyframes pulse{0%{box-shadow:0 0 0 3px currentColor}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 3px transparent}}';document.head.appendChild(style);
// fill static icon placeholders
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{map&&nudgeMap(map);routemap&&nudgeMap(routemap);},200);});
document.querySelectorAll('[data-ic]').forEach(el=>{el.outerHTML=ic(el.dataset.ic,el.dataset.c,el.dataset.s?+el.dataset.s:undefined);});
go('areas');
